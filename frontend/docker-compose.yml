version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./../backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./../backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ai-receptionist
      - RTP_HOST=backend
      - RTP_PORT=5004
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
      - "5004:5004/udp"

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      ai-service:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: asterisk
    volumes:
      - ./asterisk/conf/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/conf/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk/conf/ari.conf:/etc/asterisk/ari.conf
      - ./asterisk/conf/http.conf:/etc/asterisk/http.conf
    ports:
      - "5070:5070/udp"
      - "5061:5061/tcp"
      - "20000-20100:20000-20100/udp"
      - "8088:8088"
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: telephony_network

