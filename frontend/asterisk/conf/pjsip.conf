[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5070

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=1234

[1000-aor]
type=aor
max_contacts=1

[1000]
type=endpoint
transport=transport-udp
context=default
disallow=all
allow=ulaw
auth=1000-auth
aors=1000-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


[1000-identify]
type=identify
endpoint=1000
match=0.0.0.0/0
