[global]
type=global
endpoint_identifier_order=username,ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5070

external_signaling_address=192.168.1.28
external_media_address=192.168.1.28

local_net=172.18.0.0/16
local_net=192.168.1.0/24

[1000]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=1000
aors=1000
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

media_address=192.168.1.28
bind_rtp_to_media_address=yes
[1000]
type=auth
auth_type=userpass
username=1000
password=1234

[1000]
type=aor
max_contacts=1
remove_existing=yes